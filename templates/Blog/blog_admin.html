<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Página privada para registrar actualizaciones del blog en la base de datos. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Registrar actualización - SXcontrol</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <a class="logo" href="/" aria-label="SXcontrol, inicio">SX<span>control</span></a>
        <nav>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/blog/noticias" class="active">Blog</a></li>
            </ul>
        </nav>
    </header>
    <main class="hero">
        <h1><span>Registrar</span> actualización</h1>
        <p>Formulario interno para añadir entradas al Blog. La entrada queda guardada en la base de datos SQLite y aparece de inmediato en la página de noticias.</p>

        {% if mensaje %}
        <p class="admin-mensaje"><strong>{{ mensaje }}</strong></p>
        {% endif %}
        {% if error %}
        <p class="admin-error"><strong>{{ error }}</strong></p>
        {% endif %}

        <form method="post" action="/blog/admin" class="admin-form">
            <label for="clave">Clave de acceso</label>
            <input type="password" id="clave" name="clave" required>

            <label for="fecha">Fecha de la entrada (AAAA-MM-DD)</label>
            <input type="text" id="fecha" name="fecha" placeholder="2026-10-13" required>

            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" maxlength="120" required>

            <label for="cuerpo">Contenido (cada línea en blanco separa un párrafo)</label>
            <textarea id="cuerpo" name="cuerpo" rows="10" required></textarea>

            <button type="submit">Guardar entrada</button>
        </form>
    </main>
</body>
</html>
